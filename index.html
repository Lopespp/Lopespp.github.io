<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--csp-->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--seo-->
    <meta name="theme-color" content="#0B0D10" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="%BASE_URL%img/pietro-320.avif"
      imagesrcset="%BASE_URL%img/pietro-320.avif 320w, %BASE_URL%img/pietro-560.avif 560w"
      imagesizes="(min-width: 1025px) 280px, (min-width: 768px) 220px, 160px"
      fetchpriority="high"
    />
    <script>
      // Aplica tema, idioma e aba antes da primeira pintura, para não piscar.
      (function () {
        var d = document.documentElement;
        var read = function (key) {
          try {
            return localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        };
        d.classList.add('js');
        var theme = read('pl:theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        d.dataset.theme = theme;
        var lang = new URLSearchParams(location.search).get('lang') || read('pl:lang');
        if (lang === 'en') {
          d.lang = 'en';
          d.classList.add('lang-pending');
        }
        var hash = location.hash.slice(1);
        if (hash === 'contact') hash = 'contato';
        if (['bronze', 'silver', 'gold', 'contato'].indexOf(hash) > -1) {
          d.dataset.tab = hash;
        } else {
          d.dataset.tab = 'bronze';
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            d.classList.add('intro');
            setTimeout(function () {
              if (!d.classList.contains('hydrated')) d.classList.remove('intro');
            }, 4000);
          }
        }
        setTimeout(function () {
          d.classList.remove('lang-pending');
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
